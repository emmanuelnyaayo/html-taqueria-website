<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Emmanuel Nyaayo" />
    <meta
      name="description"
      content="Contact information for Scoville Taqueria"
    />
    <title>Contact Scoville Taqueria</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Contact Scoville Taqueria</h1>
      <nav>
        <ul>
          <li>
            <a href="/">Home</a>
          </li>
          <li>
            <a href="/#about">About Scoville Taqueria</a>
          </li>
          <li>
            <a href="/#menu">Our Menu</a>
          </li>
          <li>
            <a href="hours.html">Store Hours</a>
          </li>
        </ul>
      </nav>

      <figure>
        <img
          src="img/tacos_close_up.jpg"
          alt="Close-up of tacos with fresh toppings"
          title="Reach out to Scoville Taqueria"
          width="400"
          height="260"
        />
        <figcaption>Fresh tacos ready to order at Scoville Taqueria</figcaption>
      </figure>
    </header>
    <hr />
    <main>
      <section>
        <h2>Our Contact Form</h2>

        <form action="https://httpbin.org/get" method="get">
          <fieldset>
            <legend>Send Us A Message</legend>
            <p>
              <label for="name">Name:</label>
              <input
                type="text"
                name="name"
                id="name"
                placeholder="your name"
                required
              />
            </p>
            <p>
              <label for="email">Email:</label>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="your email"
                required
              />
            </p>
            <p>
              <label for="message">Your Message:</label>
              <br />
              <textarea
                name="message"
                id="message"
                cols="30"
                rows="10"
                placeholder="Type your message here"
              ></textarea>
            </p>
          </fieldset>
          <button type="submit">Send</button>
          <button type="reset">Reset</button>
        </form>
      </section>
      <section>
        <h2>Our Location</h2>
        <address>
          555 Taco Waiyaki Way, Suite G<br />
          Nairobi City, Gigiri 55555-5555
          <br /><br />
          Phone: <a href="tel:+1234567890">123-456-7890</a>
        </address>
      </section>
    </main>
    <hr />
    <footer>
      <p>Copyright &copy; Scoville Taqueria</p>
    </footer>
  </body>
</html>
